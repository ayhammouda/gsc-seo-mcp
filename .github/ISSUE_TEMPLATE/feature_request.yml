name: Feature request
description: Propose a focused improvement to the contained read-only server.
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Explain the user problem before proposing an implementation. Requests must respect the current release freeze and read-only containment profile.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete user or integration problem should be solved?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the smallest useful outcome, including an example if possible.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or alternative designs have you tried?
  - type: checkboxes
    id: boundaries
    attributes:
      label: Project boundaries
      options:
        - label: This proposal preserves read-only Google Search Console access.
          required: true
        - label: This proposal does not assume the release freeze has been lifted.
          required: true
