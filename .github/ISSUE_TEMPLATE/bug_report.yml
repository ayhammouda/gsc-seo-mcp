name: Bug report
description: Report a reproducible problem in gsc-seo-mcp.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve gsc-seo-mcp. Search existing issues first.
        Never include OAuth credentials, tokens, client secrets, or private Search Console data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
      placeholder: A clear, concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: List the smallest safe sequence of steps that reproduces the issue.
      placeholder: |
        1. Build from commit ...
        2. Start the server with redacted configuration ...
        3. Call ...
        4. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.x.y or a full commit SHA
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options:
        - stdio
        - Not transport-related
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include OS, Node.js version, and MCP client.
      placeholder: macOS 15, Node.js 24, Codex
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted diagnostics
      description: Paste only sanitized logs or error messages. Remove all secrets and private property data.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed credentials, tokens, secrets, and private Search Console data.
          required: true
        - label: This is not a security vulnerability.
          required: true
