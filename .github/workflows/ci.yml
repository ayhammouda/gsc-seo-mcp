name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: ["22.x", "24.x"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:unit

      - name: E2E
        run: npm run test:e2e

      - name: Package dry run
        run: npm run pack:dry-run

      - name: CLI smoke
        run: node dist/cli.js --version

  mcpb:
    name: MCPB bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate MCPB manifest
        run: npm run mcpb:validate

      - name: Build MCPB bundle
        run: npm run mcpb:pack

      - name: Verify MCPB checksum
        working-directory: artifacts
        run: sha256sum --check *.mcpb.sha256

      - name: Smoke MCPB bundle
        run: npm run mcpb:smoke

      - name: Inspect MCPB bundle
        run: |
          version=$(node -p "require('./package.json').version")
          node node_modules/@anthropic-ai/mcpb/dist/cli/cli.js info \
            "artifacts/gsc-seo-mcp-v${version}.mcpb"
