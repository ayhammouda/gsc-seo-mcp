name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and metadata versions
        run: |
          export TAG_VERSION="${GITHUB_REF_NAME#v}"
          node - <<'NODE'
          const fs = require("node:fs");
          const tagVersion = process.env.TAG_VERSION;
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const registry = JSON.parse(fs.readFileSync("server.json", "utf8"));
          const mcpb = JSON.parse(fs.readFileSync("mcpb/manifest.json", "utf8"));
          const failures = [];
          if (pkg.version !== tagVersion) failures.push(`package.json version ${pkg.version} != tag ${tagVersion}`);
          if (registry.version !== tagVersion) failures.push(`server.json version ${registry.version} != tag ${tagVersion}`);
          if (mcpb.version !== tagVersion) failures.push(`mcpb/manifest.json version ${mcpb.version} != tag ${tagVersion}`);
          if (pkg.private !== true) failures.push("package.json must remain private during the WP-00 release freeze");
          if (registry.packages?.length) failures.push("server.json must not advertise registry packages during the WP-00 release freeze");
          if (failures.length > 0) {
            for (const failure of failures) console.error(`::error::${failure}`);
            process.exit(1);
          }
          console.log(`Version check passed: ${tagVersion}`);
          NODE

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:unit

      - name: Pack
        run: npm pack --json

      - name: Build MCPB bundle
        run: npm run mcpb:pack

      - name: Verify MCPB checksum
        working-directory: artifacts
        run: sha256sum --check *.mcpb.sha256

      - name: Smoke MCPB bundle
        run: npm run mcpb:smoke

      - name: Upload release-candidate artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate-artifacts
          path: |
            *.tgz
            artifacts/*.mcpb
            artifacts/*.sha256

  release-freeze:
    name: Publishing frozen pending WP-10
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}

    steps:
      - name: Block distribution until release integrity is implemented
        run: |
          echo "::error::Release publishing is frozen. WP-10 must replace this gate with the reviewed release-integrity workflow."
          exit 1
