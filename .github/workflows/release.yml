name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and metadata versions
        run: |
          export TAG_VERSION="${GITHUB_REF_NAME#v}"
          node - <<'NODE'
          const fs = require("node:fs");
          const tagVersion = process.env.TAG_VERSION;
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const registry = JSON.parse(fs.readFileSync("server.json", "utf8"));
          const failures = [];
          if (pkg.version !== tagVersion) failures.push(`package.json version ${pkg.version} != tag ${tagVersion}`);
          if (registry.version !== tagVersion) failures.push(`server.json version ${registry.version} != tag ${tagVersion}`);
          if (pkg.private !== true) failures.push("package.json must remain private during the WP-00 release freeze");
          if (registry.packages?.length) failures.push("server.json must not advertise registry packages during the WP-00 release freeze");
          if (failures.length > 0) {
            for (const failure of failures) console.error(`::error::${failure}`);
            process.exit(1);
          }
          console.log(`Version check passed: ${tagVersion}`);
          NODE

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:unit

      - name: Pack
        run: npm pack --json

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: "*.tgz"

  release-freeze:
    name: Publishing frozen pending WP-10
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}

    steps:
      - name: Block distribution until release integrity is implemented
        run: |
          echo "::error::Release publishing is frozen. WP-10 must replace this gate with the reviewed release-integrity workflow."
          exit 1
